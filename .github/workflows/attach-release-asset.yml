name: Attach release asset

# One-shot maintenance helper: attaches an already-built, already-signed APK to an
# existing release after verifying its SHA-256. It never builds or re-signs anything.
on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: Direct download URL of the signed APK
        required: true
      sha256:
        description: Expected SHA-256 of that file (lowercase hex)
        required: true
      release_id:
        description: Numeric GitHub release id to attach the asset to
        required: true
      asset_name:
        description: File name to publish on the release
        required: false
        default: SoundSetter-v1.0.apk
      asset_label:
        description: Human-readable label for the asset
        required: false
        default: Signed APK

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download the signed APK
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 --max-time 300 \
            -o "${{ inputs.asset_name }}" "${{ inputs.asset_url }}"
          ls -l "${{ inputs.asset_name }}"
          file "${{ inputs.asset_name }}" || true

      - name: Verify SHA-256 before publishing
        run: |
          set -euo pipefail
          expected="${{ inputs.sha256 }}"
          actual="$(sha256sum "${{ inputs.asset_name }}" | cut -d' ' -f1)"
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::SHA-256 mismatch - refusing to attach a file that differs from the verified build"
            exit 1
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ inputs.asset_label }}
        run: |
          set -euo pipefail
          enc="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["LABEL"]))')"
          gh api --method POST \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --input "${{ inputs.asset_name }}" \
            "repos/${{ github.repository }}/releases/${{ inputs.release_id }}/assets?name=${{ inputs.asset_name }}&label=${enc}" \
            > asset.json
          python3 -c "import json;d=json.load(open('asset.json'));print('asset id:',d.get('id'));print('name:',d.get('name'));print('size:',d.get('size'));print('content_type:',d.get('content_type'));print('download:',d.get('browser_download_url'))"
